<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Glowcast - Gift Confirm</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Sora:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        tertiary: "#58ddab",
        "on-background": "#e6e0ec",
        surface: "#14121a",
        background: "#14121a",
        "primary-container": "#ff6b5b",
        "surface-container-high": "#2b2931",
        "surface-container": "#211e27",
        "on-surface": "#e6e0ec",
        "on-surface-variant": "#e0bfba",
        primary: "#ffb4aa",
        "tertiary-container": "#12af81",
        "on-primary": "#690003",
        secondary: "#ffb95a",
        outline: "#a88a86",
        "surface-container-lowest": "#0f0d15",
        "surface-container-highest": "#36333c"
      },
      fontFamily: {
        sans: ["Plus Jakarta Sans", "system-ui", "sans-serif"],
        display: ["Sora", "system-ui", "sans-serif"]
      }
    }
  }
}
</script>
<style>
  .material-symbols-outlined {
    font-family: "Material Symbols Outlined";
    font-weight: normal;
    font-style: normal;
    font-size: 22px;
    line-height: 1;
    display: inline-block;
    -webkit-font-feature-settings: "liga";
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
  }
  body { margin: 0; background: #14121a; min-height: 932px; }
</style>
</head>
<body class="bg-background text-on-surface font-sans antialiased">
  <div class="relative mx-auto w-[390px] min-h-[844px] overflow-hidden bg-surface-container-lowest">
    <div class="absolute inset-0 overflow-hidden">
      <div class="absolute inset-0" style="background:
        radial-gradient(ellipse 70% 50% at 50% 30%, rgba(255,107,91,0.35) 0%, transparent 55%),
        linear-gradient(180deg, #1a1524 0%, #0c0a12 100%);"></div>
      <div class="absolute inset-0 bg-black/55"></div>
    </div>

    <!-- Dimmed room chrome hint -->
    <div class="relative z-10 px-4 pt-12 opacity-50">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-full bg-white/20"></div>
        <div class="h-4 w-40 rounded bg-white/20"></div>
      </div>
    </div>

    <!-- Gift confirm sheet -->
    <div class="absolute inset-x-0 bottom-0 z-20 rounded-t-[28px] border border-white/10 bg-[#181522] px-5 pb-9 pt-3 shadow-2xl">
      <div class="mx-auto mb-4 h-1 w-12 rounded-full bg-white/25"></div>
      <div class="mb-1 flex items-start justify-between gap-3">
        <div>
          <p class="font-display text-lg font-semibold text-on-surface">Send Star?</p>
          <p class="mt-1 text-sm text-on-surface-variant">Review before it leaves your balance.</p>
        </div>
        <button type="button" class="flex h-9 w-9 items-center justify-center rounded-full bg-surface-container-high text-on-surface" aria-label="Close">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div class="mt-5 flex items-center gap-3 rounded-2xl bg-surface-container px-4 py-3">
        <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-primary-container/20 text-secondary">
          <span class="material-symbols-outlined text-[28px]" style="font-variation-settings:'FILL' 1;font-size:28px">star</span>
        </div>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-semibold text-on-surface">Star</p>
          <p class="text-xs text-on-surface-variant">Shows on Elena’s stream for ~8s</p>
        </div>
        <p class="font-display text-base font-semibold text-secondary">120 coins</p>
      </div>

      <dl class="mt-4 space-y-2.5 text-sm">
        <div class="flex justify-between gap-3">
          <dt class="text-on-surface-variant">To</dt>
          <dd class="font-medium text-on-surface">Elena &amp; The Echoes</dd>
        </div>
        <div class="flex justify-between gap-3">
          <dt class="text-on-surface-variant">Your balance after</dt>
          <dd class="font-medium text-on-surface">1,880 coins</dd>
        </div>
        <div class="flex justify-between gap-3">
          <dt class="text-on-surface-variant">Charge</dt>
          <dd class="font-semibold text-primary-container">−120 coins</dd>
        </div>
      </dl>

      <p class="mt-4 rounded-xl bg-surface-container-high/80 px-3 py-2 text-xs leading-relaxed text-on-surface-variant">
        Nothing is charged until you confirm. You can cancel anytime before Send.
      </p>

      <div class="mt-5 grid grid-cols-2 gap-3">
        <button type="button" class="rounded-full border border-white/15 px-4 py-3 text-sm font-semibold text-on-surface">Cancel</button>
        <button type="button" class="rounded-full bg-primary-container px-4 py-3 text-sm font-semibold text-on-primary">Send Star</button>
      </div>
    </div>
  </div>
</body>
</html>
