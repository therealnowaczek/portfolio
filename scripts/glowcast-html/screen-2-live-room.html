<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Glowcast - Live Room</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Sora:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        tertiary: "#58ddab",
        "surface-container-low": "#1d1a23",
        "on-background": "#e6e0ec",
        surface: "#14121a",
        background: "#14121a",
        "primary-container": "#ff6b5b",
        "surface-container-high": "#2b2931",
        "surface-container": "#211e27",
        "on-surface": "#e6e0ec",
        "on-surface-variant": "#e0bfba",
        primary: "#ffb4aa",
        "tertiary-container": "#12af81",
        "on-primary": "#690003",
        secondary: "#ffb95a",
        outline: "#a88a86",
        "surface-container-lowest": "#0f0d15",
        "surface-container-highest": "#36333c"
      },
      fontFamily: {
        sans: ["Plus Jakarta Sans", "system-ui", "sans-serif"],
        display: ["Sora", "system-ui", "sans-serif"]
      }
    }
  }
}
</script>
<style>
  .material-symbols-outlined {
    font-family: "Material Symbols Outlined";
    font-weight: normal;
    font-style: normal;
    font-size: 22px;
    line-height: 1;
    display: inline-block;
    -webkit-font-feature-settings: "liga";
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
  }
  body { margin: 0; background: #14121a; min-height: 932px; }
</style>
</head>
<body class="bg-background text-on-surface font-sans antialiased">
  <div class="relative mx-auto w-[390px] min-h-[844px] overflow-hidden bg-surface-container-lowest">
    <!-- Full-bleed stage (CSS nightlife plane; no remote hero dependency) -->
    <div class="absolute inset-0 overflow-hidden">
      <div class="absolute inset-0" style="background:
        radial-gradient(ellipse 80% 55% at 50% 28%, rgba(255,107,91,0.45) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 20% 70%, rgba(255,179,71,0.22) 0%, transparent 50%),
        radial-gradient(ellipse 45% 35% at 82% 62%, rgba(88,221,171,0.18) 0%, transparent 45%),
        linear-gradient(180deg, #1a1524 0%, #0c0a12 48%, #08070c 100%);"></div>
      <div class="absolute left-1/2 top-[22%] h-56 w-44 -translate-x-1/2 rounded-[40%] bg-gradient-to-b from-[#3a2a38] via-[#2a1f2c] to-[#1a1218] opacity-90 shadow-[0_40px_80px_rgba(0,0,0,0.55)]"></div>
      <div class="absolute left-1/2 top-[26%] h-16 w-16 -translate-x-1/2 rounded-full bg-[#4a3548] ring-2 ring-white/10"></div>
      <div class="absolute inset-x-0 top-0 h-40 bg-gradient-to-b from-black/75 to-transparent"></div>
      <div class="absolute inset-x-0 bottom-0 h-[42%] bg-gradient-to-t from-black/90 via-black/50 to-transparent"></div>
    </div>

    <!-- Status / host chrome -->
    <div class="relative z-10 px-4 pt-12">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-full bg-gradient-to-br from-primary-container to-secondary text-xs font-bold text-on-primary ring-2 ring-primary-container/80">E</div>
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2">
            <p class="font-display text-sm font-semibold text-white">Elena &amp; The Echoes</p>
            <span class="inline-flex items-center gap-1 rounded-full bg-tertiary-container px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide text-white">
              <span class="h-1.5 w-1.5 rounded-full bg-white"></span> Live
            </span>
          </div>
          <p class="truncate text-xs text-white/75">Late night rooftop jam · Music</p>
        </div>
        <div class="flex items-center gap-2">
          <span class="rounded-full bg-black/45 px-2.5 py-1 text-xs font-semibold text-white backdrop-blur">2.4k</span>
          <button type="button" class="flex h-9 w-9 items-center justify-center rounded-full bg-black/45 text-white backdrop-blur" aria-label="Leave room">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Gift tray (face-safe, right rail) -->
    <div class="absolute right-3 top-[38%] z-10 flex flex-col gap-2">
      <button type="button" class="flex h-11 w-11 flex-col items-center justify-center rounded-2xl bg-black/40 text-white backdrop-blur" aria-label="Send heart">
        <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">favorite</span>
      </button>
      <button type="button" class="flex h-11 w-11 flex-col items-center justify-center rounded-2xl bg-black/40 text-secondary backdrop-blur" aria-label="Open gifts">
        <span class="material-symbols-outlined">featured_seasonal_and_gifts</span>
      </button>
      <button type="button" class="flex h-11 w-11 flex-col items-center justify-center rounded-2xl bg-primary-container text-on-primary backdrop-blur" aria-label="Send star gift">
        <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">star</span>
      </button>
      <button type="button" class="flex h-11 w-11 flex-col items-center justify-center rounded-2xl bg-black/40 text-white backdrop-blur" aria-label="More reactions">
        <span class="material-symbols-outlined">add_reaction</span>
      </button>
    </div>

    <!-- Chat + composer (bottom third) -->
    <div class="absolute inset-x-0 bottom-0 z-10 px-4 pb-8 pt-4">
      <div class="mb-3 space-y-2 max-w-[78%]">
        <p class="rounded-2xl bg-black/35 px-3 py-1.5 text-xs text-white/90 backdrop-blur"><span class="font-semibold text-secondary">Maya</span> this set is unreal</p>
        <p class="rounded-2xl bg-black/35 px-3 py-1.5 text-xs text-white/90 backdrop-blur"><span class="font-semibold text-tertiary">Kenji</span> request: midnight acoustic?</p>
        <p class="rounded-2xl bg-black/35 px-3 py-1.5 text-xs text-white/90 backdrop-blur"><span class="font-semibold text-primary">Sam</span> just sent a Star · thanks Elena</p>
      </div>
      <div class="flex items-center gap-2">
        <div class="flex flex-1 items-center gap-2 rounded-full border border-white/15 bg-black/40 px-4 py-2.5 backdrop-blur">
          <input class="w-full bg-transparent text-sm text-white placeholder:text-white/50 outline-none" placeholder="Say something…" type="text" readonly/>
        </div>
        <button type="button" class="flex h-11 w-11 items-center justify-center rounded-full bg-primary-container text-on-primary" aria-label="Send message">
          <span class="material-symbols-outlined">send</span>
        </button>
      </div>
      <div class="mx-auto mt-3 h-1 w-28 rounded-full bg-white/35"></div>
    </div>
  </div>
</body>
</html>
